<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🪬UNIVERSO • Tu Futuro Ya Existe</title>
  <style>
    :root {
      --bg-dark: #0a0b10;
      --card-bg: rgba(22, 25, 38, 0.75);
      --accent-gold: #e2c99f;
      --text-light: #f1ebd9;
      --text-muted: #9a9ea8;
      --border-glow: rgba(226, 201, 159, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 10%, rgba(30, 35, 60, 0.8), transparent 70%),
        radial-gradient(circle at 50% 90%, rgba(15, 18, 30, 0.9), transparent 80%);
      color: var(--text-light);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
      overflow-x: hidden;
    }

    /* Partículas estelares de fondo */
    .stars {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      background: radial-gradient(1.5px 1.5px at 20px 30px, #ffffff15, rgba(0,0,0,0)),
                  radial-gradient(1px 1px at 150px 150px, #ffffff20, rgba(0,0,0,0)),
                  radial-gradient(2px 2px at 280px 70px, rgba(226,201,159,0.3), rgba(0,0,0,0));
      background-repeat: repeat;
      background-size: 300px 300px;
      z-index: 0;
    }

    /* App Container Móvil Centrado */
    .app-viewport {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      height: 92vh;
      max-height: 850px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-glow);
      border-radius: 36px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 40px rgba(226, 201, 159, 0.05);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 25px 20px;
      overflow: hidden;
    }

    /* Cabecera & Respiración */
    header {
      text-align: center;
      width: 100%;
    }

    .brand {
      font-size: 13px;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: var(--accent-gold);
      font-weight: 300;
      opacity: 0.9;
    }

    .subtitle {
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--text-muted);
      font-weight: 200;
      margin-top: 4px;
    }

    .calm-pill {
      margin: 15px auto 5px;
      padding: 6px 16px;
      border-radius: 20px;
      background: rgba(226, 201, 159, 0.08);
      border: 1px solid rgba(226, 201, 159, 0.15);
      font-size: 10px;
      letter-spacing: 1.5px;
      color: var(--accent-gold);
      text-transform: uppercase;
      font-weight: 300;
      animation: pulseBreath 4s infinite ease-in-out;
      display: inline-block;
    }

    @keyframes pulseBreath {
      0%, 100% { opacity: 0.6; transform: scale(0.98); }
      50% { opacity: 1; transform: scale(1.03); }
    }

    /* Portal de la Imagen */
    .portal-frame {
      width: 100%;
      flex: 1;
      max-height: 480px;
      margin: 15px 0;
      position: relative;
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(10, 11, 16, 0.5);
    }

    .portal-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 0.5s ease, transform 0.8s ease;
    }

    /* Afirmación & Frase */
    .manifestation-card {
      width: 100%;
      min-height: 60px;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 10px;
    }

    .quote-text {
      font-size: 13px;
      font-weight: 200;
      letter-spacing: 1px;
      line-height: 1.6;
      color: var(--text-light);
      font-style: italic;
      transition: opacity 0.4s ease;
    }

    /* Controles & Botones */
    .nav-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
    }

    .icon-btn {
      background: transparent;
      border: 1px solid var(--border-glow);
      color: var(--accent-gold);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .icon-btn:active {
      transform: scale(0.9);
      background: rgba(226, 201, 159, 0.15);
    }

    .counter {
      font-size: 11px;
      letter-spacing: 3px;
      color: var(--text-muted);
      font-weight: 300;
    }

    .action-row {
      display: flex;
      gap: 10px;
      width: 100%;
      margin-top: 12px;
    }

    .upload-label {
      flex: 1;
      border: 1px solid var(--border-glow);
      background: rgba(226, 201, 159, 0.05);
      color: var(--accent-gold);
      padding: 10px;
      border-radius: 16px;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-align: center;
      cursor: pointer;
      font-weight: 300;
      transition: all 0.3s ease;
    }

    .upload-label:hover {
      background: rgba(226, 201, 159, 0.15);
    }

    input[type="file"] { display: none; }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      font-weight: 200;
      font-size: 12px;
      letter-spacing: 1.5px;
      padding: 40px 20px;
      line-height: 1.8;
    }
  </style>
</head>
<body>

  <div class="stars"></div>

  <div class="app-viewport">
    <header>
      <div class="brand">UNIVERSO</div>
      <div class="subtitle">TU FUTURO YA EXISTE EN EL PRESENTE</div>
      <div class="calm-pill">Inhala Paz • Exhala Certeza</div>
    </header>

    <div class="portal-frame" id="portalFrame">
      <div class="empty-state" id="emptyState">
        Toca abajo para cargar tus 33 imágenes.<br>Cierra los ojos, respira y conéctate con tu nueva vida.
      </div>
      <img id="currentImage" src="" alt="Portal" style="display: none;">
    </div>

    <div class="manifestation-card">
      <div class="quote-text" id="quoteText">"Esta paz que sientes es la certeza de que tu realidad ideal ya es tuya."</div>
    </div>

    <div class="nav-bar">
      <button class="icon-btn" id="prevBtn">&larr;</button>
      <span class="counter" id="pageCounter">0 / 33</span>
      <button class="icon-btn" id="nextBtn">&rarr;</button>
    </div>

    <div class="action-row">
      <label for="imageLoader" class="upload-label">Sincronizar 33 Imágenes</label>
      <input type="file" id="imageLoader" accept="image/*" multiple>
    </div>
  </div>

  <script>
    const quotes = [
      "Estoy abierto a recibir todas las riquezas que el universo quiere darme.",
      "Atraigo todo lo que necesito para alcanzar el éxito.",
      "Cada segundo que pasa soy más rico.",
      "Me entusiasma que otras personas reciban dinero.",
      "Todo lo que necesito para alcanzar el éxito llega a mí sin esfuerzo y con facilidad.",
      "Deseo buena fortuna y felicidad para mí y para todos.",
      "Tengo más que suficiente.",
      "Me encanta compartir mi abundancia con mis seres queridos.",
      "El dinero abunda y está viniendo hacia mí.",
      "Todos los días recibo más dinero.",
      "Doy las gracias por mi riqueza y mi prosperidad que no dejan de aumentar.",
      "Tengo dinero para cumplir con todas mis obligaciones económicas, ahora y por siempre.",
      "Doy la bienvenida a mi vida a toda la abundancia y a todas las riquezas del planeta.",
      "Le doy las gracias al universo por toda la prosperidad que hoy es mía.",
      "Estoy deseando ver de dónde vendrá más dinero.",
      "Tengo la intención de que el dinero fluya hacia mí hoy.",
      "Digo SÍ a la independencia económica para mí y para todos los que me rodean.",
      "Estoy abierto a la posibilidad de que el dinero fluya hacia mí desde todas las direcciones.",
      "El mundo nunca ha sido tan rico, y yo recibo muchas de esas riquezas.",
      "La independencia económica depende de mí, y la elijo para mí.",
      "Me abro a la posibilidad de que la buena suerte llegue a mí.",
      "El universo no deja de proporcionarme toda la abundancia que necesito para tener una vida plena y feliz.",
      "He tomado una decisión: «SÍ, SÍ, SÍ» a más dinero.",
      "Permito que el dinero en todas sus formas fluya continuamente a mi vida.",
      "El universo ha recibido mi petición de más dinero y hará que aparezca ante mí.",
      "La riqueza ilimitada está disponible para mí en todo momento; me abro a recibirla.",
      "Mis ventas crecen en abundancia; el flujo financiero es inevitable y seguro.",
      "El dinero fluye hacia mí en efectivo y tarjeta con total facilidad.",
      "Mi departamento blanco y madera clara es mi refugio de paz e inspiración.",
      "La vista hacia el horizonte me recuerda que mis posibilidades son infinitas.",
      "Aprecio la compañía, lealtad y ternura indiscutible de mi yorkshire.",
      "Comparto mi camino con un amor verdadero, enérgico y conectado.",
      "Disfruto el proceso de hoy; es la semilla del éxito que estoy viviendo.",
      "Mi mente está tranquila, mi corazón confiado y mi futuro asegurado."
    ];

    let imageList = [];
    let currentIndex = 0;

    const imageLoader = document.getElementById('imageLoader');
    const emptyState = document.getElementById('emptyState');
    const currentImage = document.getElementById('currentImage');
    const quoteText = document.getElementById('quoteText');
    const pageCounter = document.getElementById('pageCounter');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    window.addEventListener('DOMContentLoaded', () => {
      const savedImages = localStorage.getItem('universoImages');
      if (savedImages) {
        imageList = JSON.parse(savedImages);
        if (imageList.length > 0) renderApp();
      }
    });

    imageLoader.addEventListener('change', function(e) {
      const files = Array.from(e.target.files).slice(0, 33);
      if (files.length === 0) return;

      let loadedCount = 0;
      const newImages = [];

      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = function(event) {
          newImages.push(event.target.result);
          loadedCount++;

          if (loadedCount === files.length) {
            imageList = newImages;
            try {
              localStorage.setItem('universoImages', JSON.stringify(imageList));
            } catch (err) {
              alert("Te sugerimos subir fotos comprimidas para guardar las 33 sin problema.");
            }
            currentIndex = 0;
            renderApp();
          }
        };
        reader.readAsDataURL(file);
      });
    });

    function renderApp() {
      if (imageList.length === 0) return;

      emptyState.style.display = 'none';
      currentImage.style.display = 'block';

      currentImage.style.opacity = 0;
      setTimeout(() => {
        currentImage.src = imageList[currentIndex];
        currentImage.style.opacity = 1;
      }, 200);

      const quoteIndex = currentIndex % quotes.length;
      quoteText.style.opacity = 0;
      setTimeout(() => {
        quoteText.textContent = `"${quotes[quoteIndex]}"`;
        quoteText.style.opacity = 1;
      }, 200);

      pageCounter.textContent = `${currentIndex + 1} / ${imageList.length}`;
    }

    prevBtn.addEventListener('click', () => {
      if (imageList.length === 0) return;
      currentIndex = (currentIndex - 1 + imageList.length) % imageList.length;
      renderApp();
    });

    nextBtn.addEventListener('click', () => {
      if (imageList.length === 0) return;
      currentIndex = (currentIndex + 1) % imageList.length;
      renderApp();
    });
  </script>
</body>
</html>
